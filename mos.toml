[settings]
dotfiles_dir = "~/.dotfiles"
backup_dir = "~/.mos-backups"
backup_format = "{name}.{datetime}.bak"
commit_cmd = "bark commit"

[hosts."Ionuts-MacBook-Pro-Max.local"]
os = "macos"
package_manager = "brew"
default_profile = "home"

[hosts."MacBook Pro M3"]
os = "macos"
package_manager = "brew"
default_profile = "thegrind"

[profiles.home]
description = "Personal configuration"
tracked = true
modules = [
  "toolchains",
  "aerospace",
  "ask",
  "atuin",
  "bark",
  "borders",
  "ghostty",
  "git",
  "helix",
  "lens",
  "nushell",
  "nvim",
  "perp",
  "search",
  "sketchybar",
  "starship",
  "tmux",
  "vex",
  "vim",
  "yazi",
  "zsh",
  "bash",
]

[profiles.thegrind]
description = "Where dreams come to sprint and die in backlog"
tracked = false
modules = [
  "toolchains",
  "aerospace",
  "ask",
  "bark",
  "borders",
  "ghostty",
  "lens",
  "nushell",
  "nvim",
  "perp",
  "search",
  "starship",
  "tmux",
  "vex",
  "vim",
  "yazi",
  "zsh",
]

[modules.aerospace]
source = "aerospace/.config/aerospace"
target = "~/.config/aerospace"
tracked = true

[modules.aerospace.deps]
brew = ["aerospace"]

[modules.alacritty]
source = "alacritty/.config/alacritty"
target = "~/.config/alacritty"
tracked = true

[modules.alacritty.deps]
packages = ["alacritty"]

[modules.ask]
source = "ask/ask"
target = "~/ask"
tracked = true

[modules.atuin]
source = "atuin/.config/atuin"
target = "~/.config/atuin"
tracked = true

[modules.atuin.deps]
packages = ["atuin"]

[modules.borders]
source = "borders/.config/borders"
target = "~/.config/borders"
tracked = true

[modules.borders.deps]
brew = ["borders"]

[modules.ghostty]
source = "ghostty/.config/ghostty"
target = "~/.config/ghostty"
tracked = true

[modules.git]
source = "git/.gitconfig"
target = "~/.gitconfig"
tracked = true

[modules.git.deps]
packages = ["git", "gh"]

[modules.helix]
source = "helix/.config/helix"
target = "~/.config/helix"
tracked = true

[modules.helix.deps]
packages = ["helix"]

[modules.kitty]
source = "kitty/.config/kitty"
target = "~/.config/kitty"
tracked = true

[modules.kitty.deps]
packages = ["kitty"]

[modules.nushell]
source = "nushell/.config/nushell"
target = "~/.config/nushell"
tracked = true

[modules.nushell.deps]
packages = ["nushell"]

[modules.nvim]
source = "nvim/.config/nvim"
target = "~/.config/nvim"
tracked = true

[modules.nvim.deps]
packages = [
  "neovim",
  "ripgrep",
  { brew = "fd", apt = "fd-find" },
  { brew = "node", apt = "nodejs" },
]
cargo = ["stylua"]
go = ["github.com/jesseduffield/lazygit@latest"]

[modules.search]
source = "search/.ignore"
target = "~/.ignore"
tracked = true

[modules.sketchybar]
source = "sketchybar/.config/sketchybar"
target = "~/.config/sketchybar"
tracked = true

[modules.sketchybar.deps]
brew = ["sketchybar"]

[modules.starship]
source = "starship/.config"
target = "~/.config"
tracked = true

[modules.starship.deps]
script = [
  { name = "starship", cmd = "curl -sS https://starship.rs/install.sh | sh" },
]

[modules.tmux]
source = "tmux/.tmux.conf"
target = "~/.tmux.conf"
tracked = true

[modules.tmux.deps]
packages = ["tmux"]

[modules.vim]
source = "vim/.vimrc"
target = "~/.vimrc"
tracked = true

[modules.vim.deps]

[modules.yazi]
source = "yazi/.config/yazi"
target = "~/.config/yazi"
tracked = true

[modules.yazi.deps]
packages = [
  { brew = "yazi" },
  "ffmpeg",
  { brew = "sevenzip", apt = "7zip" },
  "jq",
  { brew = "poppler", apt = "poppler-utils" },
  { brew = "fd", apt = "fd-find" },
  "ripgrep",
  "fzf",
  "zoxide",
  { brew = "resvg" },
  "imagemagick",
]
script = [{ name = "yazi", cmd = "cargo install --locked yazi-fm yazi-cli" }]

[modules.toolchains]

[modules.toolchains.deps]
packages = [{ brew = "go", apt = "golang-go" }]
script = [
  { name = "cargo", cmd = "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y" },
]

[modules.bark]

[modules.bark.deps]
go = ["github.com/ionut-t/bark/v2@latest"]

[modules.vex]

[modules.vex.deps]
go = ["github.com/ionut-t/vex@latest"]

[modules.perp]

[modules.perp.deps]
go = ["github.com/ionut-t/perp@latest"]

[modules.lens]

[modules.lens.deps]
script = [
  { name = "lens", cmd = "cargo install --git https://github.com/ionut-t/lens" },
]

[modules.bash]
source = "bash/.bashrc"
target = "~/.bashrc"
tracked = true

[modules.bash.deps]
packages = ["fzf", "eza", "bat", "zoxide", "jq", "ripgrep", "neovim"]

[modules.zsh]
source = "zsh/.zshrc"
target = "~/.zshrc"
tracked = true

[modules.zsh.deps]
packages = ["fzf", "eza", "bat", "zoxide", "jq", "thefuck"]

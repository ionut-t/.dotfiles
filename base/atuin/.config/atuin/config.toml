# ═══════════════════════════════════════════════════════════════
#  Atuin Configuration - Clean & Readable
# ═══════════════════════════════════════════════════════════════

# Core Settings
auto_sync = false
update_check = false
dialect = "us"
timezone = "local"

# Search
search_mode = "daemon-fuzzy"
filter_mode = "global"
workspaces = true
filter_mode_shell_up_key_binding = "workspace"

style = "auto"
# invert = true
show_preview = true
show_help = false
show_tabs = true
show_numeric_shortcuts = false

history_format = "{duration} - {command}"

# Interactions
enter_accept = true
exit_mode = "return-original"
word_jump_mode = "emacs"
scroll_context_lines = 3
keymap_mode = "auto"
command_chaining = true

# Cursor
keymap_cursor = { emacs = "blink-block", vim_insert = "blink-bar", vim_normal = "steady-block" }

# Performance
prefers_reduced_motion = false
local_timeout = 5
max_preview_height = 8

# Security
secrets_filter = true
history_filter = [
  "^export.*KEY",
  "^export.*TOKEN",
  "^export.*SECRET",
  "^export.*PASSWORD",
  "^.*--password",
  "^.*--token",
]

# Stats
[stats]
common_subcommands = [
  "git",
  "docker",
  "kubectl",
  "npm",
  "yarn",
  "pnpm",
  "cargo",
  "go",
  "tmux",
  "nvim",
  "gh",
]
common_prefix = ["sudo"]
ignored_commands = ["ls", "cd", "pwd", "clear", "exit", "z", "f", "fp"]

[keys]
scroll_exits = false
exit_past_line_start = false
accept_past_line_end = true

[preview]
strategy = "auto"

[sync]
records = true

[theme]
name = "catppuccin-mocha"

[daemon]
enabled = true
autostart = true

[tmux]
enabled = true

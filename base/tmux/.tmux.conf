# ============================================================================
# GENERAL SETTINGS
# ============================================================================

# Set default terminal with true color support
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-ghostty:Tc"
set -ga terminal-overrides ",xterm-ghostty:Ss=\\E[%p1%d q:Se=\\E[2 q"

# Start indexing windows at 1 instead of 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Enable mouse support
set -g mouse on

# Use vi mode for copy mode
setw -g mode-keys vi

# Increase scrollback buffer size
set -g history-limit 10000

# Faster command sequences (reduce delay)
set -s escape-time 0

# Increase display time for messages
set -g display-time 2000

# Focus events enabled for terminals that support them
set -g focus-events on

# Forward OSC 52 clipboard sequences from inner apps (nvim) to the outer terminal
# Required for clipboard-over-SSH 
set -s set-clipboard on

# Aggressive resize (useful for multi-monitor setups)
setw -g aggressive-resize on

# ============================================================================
# PREFIX KEY
# ============================================================================

# Change prefix from C-b to C-a
set -g prefix C-a
unbind C-b
bind-key -N "Send C-a to the program in the pane" C-a send-prefix

# ============================================================================
# KEY BINDINGS
# ============================================================================

# Window management
bind -N "New window in the current directory" c new-window -c "#{pane_current_path}"

# Split panes
unbind %
bind -N "Split side by side in the current directory" | split-window -h -c "#{pane_current_path}"

unbind '"'
bind -N "Split top/bottom in the current directory" - split-window -v -c "#{pane_current_path}"

# Reload config
unbind r
bind -N "Reload tmux config" r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Terminal reset
bind -N "Reset the terminal and clear scrollback" Q send-keys -R \; clear-history \; send-keys C-l \; display-message "Terminal has been reset"

# Better pane navigation with awareness
bind -N "Select the pane on the left" h select-pane -L
bind -N "Select the pane below" j select-pane -D

# Pane resizing
bind -N "Resize pane leftwards (repeatable)" -r H resize-pane -L 5
bind -N "Resize pane downwards (repeatable)" -r J resize-pane -D 5
bind -N "Resize pane upwards (repeatable)" -r K resize-pane -U 5
bind -N "Resize pane rightwards (repeatable)" -r L resize-pane -R 5

# Quick window switching
bind -N "Previous window (repeatable)" -r C-h select-window -t :-

# Kill pane/window without confirmation
bind -N "Kill pane (no confirmation)" x kill-pane
bind -N "Kill window (no confirmation)" X kill-window

# Toggle synchronize-panes
bind -N "Toggle synchronized input across panes" S set-window-option synchronize-panes\; display-message "synchronize-panes is now #{?pane_synchronized,on,off}"

# Popup windows
bind -N "Shell popup in the current directory" g display-popup -E -w 60% -h 60% -d "#{pane_current_path}"

bind -N "Open yazi file manager" y new-window -n "yazi" -c "#{pane_current_path}" "yazi"
bind -N "Open superfile file manager" s new-window -n "superfile" -c "#{pane_current_path}" "spf"

# File finder with preview (opens in nvim)
bind -N "Find a file and open it in nvim" f display-popup -E -w 80% -h 80% -d "#{pane_current_path}" \
  "fzf --preview 'bat --color=always --style=numbers --line-range=:500 {}' \
   --header 'Find' \
   --bind 'enter:execute(nvim {})+abort'"

# Grep search with preview
bind -N "Search file contents (rg) and open in nvim" / display-popup -E -w 80% -h 80% -d "#{pane_current_path}" \
  "rg --color=always --line-number --no-heading --smart-case '' | \
   fzf --ansi --delimiter ':' \
   --preview 'bat --color=always {1} --highlight-line {2}' \
   --preview-window 'up,60%,border-bottom,+{2}+3/3' \
   --header 'Search in files' \
   --bind 'enter:execute(nvim +{2} {1})+abort'"

# Process killer (clean format: PID, CPU, MEM, COMMAND)
bind -N "Pick a process to kill" p display-popup -E -w 80% -h 80% \
  "ps aux | awk 'NR==1 {print \"PID\t%CPU\t%MEM\tCOMMAND\"; next} {printf \"%s\t%s\t%s\t\", \$2, \$3, \$4; for(i=11;i<=NF;i++) printf \"%s \", \$i; print \"\"}' | \
   column -t -s $'\t' | \
   fzf --header-lines=1 --header 'Select process to kill (Esc to cancel)' | \
   awk '{print \$1}' | xargs -r kill"

# Session manager (tsm)
set-hook -g after-select-window 'run-shell "tsm record"'
set-hook -g after-new-window 'run-shell "tsm record"'

bind -N "Fuzzy-switch to any window" o display-popup -E -w 80% -h 80% "tsm switch-window --preview"
bind -N "Fuzzy-switch to a session" O display-popup -E -w 40% -h 40% "tsm switch"
bind -N "Pick a session to kill" k display-popup -E -w 40% -h 40% "tsm kill --quiet"
bind -N "New session from a zoxide directory" n display-popup -E -w 80% -h 80% "tsm new --preview --quiet"
bind -N "Move this window to another session" M display-popup -E -w 80% -h 80% "tsm move-window --quiet"
bind -N "Start a workspace" W display-popup -E -w 80% -h 80% "tsm workspace"
bind -N "Last window in this session" l run-shell "tsm last-window --current-session"
bind -N "Last session" L run-shell "tsm last-session"
bind -N "Swap this window with another index" m command-prompt -p "Swap with window:" "run-shell 'tsm swap-window -t %% --quiet'"
bind -N "Command palette (tsm help)" ? display-popup -E -w 100% -h 100% "tsm help"

# Commit changes (bark)
bind -N "Commit changes (bark)" b new-window -n "bark" -c "#{pane_current_path}" "zsh -i -c 'bark commit'"
bind -N "Commit all changes and push (bark)" B new-window -n "bark-all" -c "#{pane_current_path}" "zsh -i -c 'bark commit --all && git push'"

# Vi copy mode bindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection

# View scrollback with line numbers
bind -N "View scrollback in nvim" v run-shell "tmux capture-pane -p -S -5000 | sed 's/\x1b\[[0-9;]*m//g' > /tmp/tmux-scrollback && tmux new-window 'nvim -R /tmp/tmux-scrollback'"

# ============================================================================
# THEME & STATUS BAR
# ============================================================================

# Theme - Catppuccin
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_text " #{window_name}"
set -g @catppuccin_window_status_style "slanted" # options: none, slanted, rounded
set -g @catppuccin_window_current_text " #{window_name}"
set -g @catppuccin_date_time_text " %d/%m/%y %H:%M"

# Status bar configuration
set -g status-position bottom
set -g status-justify centre
set -g status-left-length 100
set -g status-right-length 100

# Left side: session only
set -g status-left "#{E:@catppuccin_status_session}"

# Right side: cpu, battery, date_time
set -gF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_battery}"
set -agF status-right "#{E:@catppuccin_status_date_time}"

# ============================================================================
# PLUGINS
# ============================================================================

# TPM - Tmux Plugin Manager
set -g @plugin 'tmux-plugins/tpm'

# Navigation
set -g @plugin 'christoomey/vim-tmux-navigator'

# Theme plugin (loads catppuccin theme configured above)
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# Status bar plugins
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'

# Session resurrection (disabled)
# set -g @resurrect-capture-pane-contents 'on'
# set -g @continuum-restore 'on'

# ============================================================================
# INITIALIZE TPM (keep this at the very bottom)
# ============================================================================

run '~/.tmux/plugins/tpm/tpm'

# Notes for vim-tmux-navigator's root bindings (shown by `tsm help` / `list-keys -N`).
# `bind -N` without a command only sets the note, keeping the plugin's command;
# it must come after TPM has loaded the plugin, and is a no-op if it isn't loaded.
bind -N "Move to the pane on the left (vim-aware)" -n C-h
bind -N "Move to the pane below (vim-aware)" -n C-j
bind -N "Move to the pane above (vim-aware)" -n C-k
bind -N "Move to the pane on the right (vim-aware)" -n C-l
bind -N "Move to the previous pane (vim-aware)" -n 'C-\'

# Notes for plugin prefix bindings: TPM's I/U/M-u, and vim-tmux-navigator's C-l.
bind -N "Install plugins (TPM)" I
bind -N "Update plugins (TPM)" U
bind -N "Remove unused plugins (TPM)" M-u
bind -N "Clear the screen (vim-tmux-navigator)" C-l

# https://github.com/tmux/tmux/issues/5317
# Remove this override once either issue is fixed upstream.
set -gF message-style "fg=#{@thm_teal},bg=$CTP_MESSAGE_BACKGROUND,fill=$CTP_MESSAGE_BACKGROUND"
set -gF message-command-style "fg=#{@thm_teal},bg=$CTP_MESSAGE_BACKGROUND,fill=$CTP_MESSAGE_BACKGROUND"
